<!-- 멀티레벨 분석 조각 — build.py 가 body 의 자료 스크립트 앞에 끼운다. '왜 비는가'(회귀) 구역 바로 뒤에 새 구역을 단다.
     자료: multilevel.py → data/multilevel.json -->
<style>
.ml-stack{display:flex;height:26px;border-radius:5px;overflow:hidden;margin:6px 0 4px}
.ml-stack span{display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:700;color:#fff;white-space:nowrap;overflow:hidden}
.ml-leg{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:11.5px;color:var(--ink2);margin-bottom:10px}
.ml-leg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.ml-step{display:grid;grid-template-columns:150px minmax(0,1fr) minmax(0,1fr) 46px;gap:8px;align-items:center;font-size:12px;padding:3px 0}
.ml-step.h{color:var(--ink3);font-size:11px}
.ml-step .bt{height:10px;background:var(--line2);border-radius:3px;position:relative;overflow:hidden}
.ml-step .bt i{position:absolute;left:0;top:0;bottom:0;border-radius:3px}
.ml-step .v{font-family:var(--mono);font-size:11px;color:var(--ink2);text-align:right}
.ml-lv{font-size:11px;font-weight:700;color:var(--ink3);margin:8px 0 2px;letter-spacing:.04em}
.fr .tag{display:inline-block;font-size:10px;font-weight:600;color:var(--accent);border:1px solid var(--accent);border-radius:3px;padding:0 3px;margin-left:4px;vertical-align:1px}
.ml-find{margin-top:12px}
.ml-find li{font-size:12.5px;color:var(--ink2);margin:3px 0}
</style>
<script type="application/json" id="data-ml">/*__DATA_ML__*/null</script>
<script>
(function(){
"use strict";
const M = JSON.parse(document.getElementById("data-ml").textContent); if (!M) return;
const after = document.getElementById("forest")?.closest("section"); if (!after) return;
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pct = v => v == null ? "—" : Math.round(v * 100) + "%";
const S = Object.fromEntries(M.steps.map(s => [s.step, s])), M0 = S.M0, M4 = S.M4;
const F4 = Object.fromEntries((M.full.find(s => s.step === "M4") || {coefs: []}).coefs.map(c => [c.key, c]));
const G = Object.fromEntries(M.glmm.coefs.map(c => [c.key, c]));
const tot0 = M0.var.L3 + M0.var.L2 + M0.var.L1;
const COL = {L3: "#7A4FB5", L2: "#1D5C7C", L1: "#9AA5A9"};
const share = k => M0.var[k] / tot0 * 100;

/* 수준별 분산(빈 모형) */
const stack = ["L3", "L2", "L1"].map(k => `<span style="width:${share(k)}%;background:${COL[k]}">${share(k) >= 6 ? Math.round(share(k)) + "%" : ""}</span>`).join("");
const steps = M.steps.slice(1).map(s => `<div class="ml-step"><span>${esc(s.name)}</span>
  <span class="bt"><i style="width:${Math.max(0, (s.pcv.L2 || 0) * 100)}%;background:${COL.L2}"></i></span>
  <span class="bt"><i style="width:${Math.max(0, (s.pcv.L1 || 0) * 100)}%;background:${COL.L1}"></i></span>
  <span class="v">${s.r2m.toFixed(2)}</span></div>`).join("");

/* M4 계수 — 수준별로 묶어 */
const C = M4.coefs, lo = Math.floor(Math.min(...C.map(c => c.lo), -5) / 10) * 10, hi = Math.ceil(Math.max(...C.map(c => c.hi), 5) / 10) * 10;
const pos = v => (v - lo) / (hi - lo) * 100, ticks = []; for (let t = lo; t <= hi; t += 10) ticks.push(t);
const row = c => { const sig = c.p < 0.05, col = sig ? (c.b > 0 ? "var(--bad)" : "var(--good)") : "var(--ink3)";
  const f = F4[c.key], g = G[c.key];
  const tag = (f && f.p < 0.05 ? '<span class="tag" title="점포 정보 없는 21동까지 넣은 287동 모형에서도 유의">287동 유의</span>' : "");
  return `<div class="fr${sig ? " sig" : ""}"><span class="fn">${esc(c.name)} <small>/${esc(c.unit)}</small>${tag}</span>
    <span class="ft">${ticks.map(t => `<b style="left:${pos(t)}%"${t === 0 ? ' class="z"' : ""}></b>`).join("")}
      <em style="left:${pos(c.lo)}%;width:${pos(c.hi) - pos(c.lo)}%;background:${col}"></em><u style="left:${pos(c.b)}%;background:${col}"></u></span>
    <span class="fv">${c.b > 0 ? "+" : ""}${c.b.toFixed(1)}</span></div>`; };
const axis = `<div class="fr fr-axis"><span></span><span class="ft">${ticks.map(t => `<i style="left:${pos(t)}%">${t > 0 ? "+" : ""}${t}</i>`).join("")}</span><span></span></div>`;
const forest = axis + ["건물", "반경", "행정동"].map(lv => `<div class="ml-lv">${lv === "반경" ? "반경(배후 수요·공급)" : lv} 수준</div>` +
  C.filter(c => c.level === lv).sort((a, b) => b.b - a.b).map(row).join("")).join("");
const agree = C.filter(c => G[c.key] && Math.sign(c.b) === Math.sign(Math.log(G[c.key].or))).length;

const sph = C.find(c => c.key === "log2_sph"), sphF = F4.log2_sph;
const sec = document.createElement("section");
sec.id = "ml-sec";
sec.innerHTML = `<div class="sec-h"><h2>멀티레벨 분석 — 건물·상권·행정동</h2>
  <div class="note">건물(${M.n}동)을 동 세부 소권역(${M.n_L2}곳) 안에, 소권역을 행정동(${M.n_L3}곳) 안에 둔 3수준 혼합모형입니다. 공실 차이가 어느 수준에서 생기는지 나누고, 건물 내부(층·주차·입점 업종)·배후 수요(반경 500m 세대)·행정동 여건을 단계별로 더해 각 수준의 차이를 얼마나 설명하는지 봅니다.</div></div>
  <div class="two">
    <div class="card"><h3>공실 차이는 어느 수준에서 나는가</h3>
      <div class="ml-stack">${stack}</div>
      <div class="ml-leg"><span><i style="background:${COL.L3}"></i>행정동 간 ${share("L3").toFixed(0)}%</span><span><i style="background:${COL.L2}"></i>소권역(상권 블록) 간 ${share("L2").toFixed(0)}%</span><span><i style="background:${COL.L1}"></i>같은 소권역 안 건물 간 ${share("L1").toFixed(0)}%</span></div>
      <div class="ml-step h"><span>단계</span><span>소권역 간 차이 설명</span><span>건물 간 차이 설명</span><span style="text-align:right">R²</span></div>
      ${steps}
      <ul class="ml-find">
        <li><b>상권 블록이 단위다</b> — 행정동 고유 차이는 거의 없고(${share("L3").toFixed(0)}%), 공실은 같은 동 안에서도 소권역마다 갈립니다. 대응은 동 단위보다 블록 단위가 맞습니다.</li>
        <li>소권역 간 차이의 <b>${pct(S.M1.pcv.L2)}</b>를 건물 연식·용도가, 배후 수요·공급을 더하면 <b>${pct(S.M3.pcv.L2)}</b>, 행정동 여건까지 <b>${pct(M4.pcv.L2)}</b>를 설명합니다.</li>
        <li>같은 블록 안 건물 간 차이는 ${pct(M4.pcv.L1)}만 설명됩니다 — 관리·임대료·개별 사정 등 자료에 없는 건물 고유 요인이 큽니다.</li>
      </ul></div>
    <div class="card"><h3>모든 수준을 함께 넣은 모형(M4): 공실률 변화(%p, 95% 신뢰구간)</h3>${forest}
      <p class="small muted" style="margin:8px 0 0">진한 이름 = 유의(p&lt;0.05). <span class="tag" style="font-size:10px;color:var(--accent);border:1px solid var(--accent);border-radius:3px;padding:0 3px">287동 유의</span> = 점포 정보가 없는 ${M.excluded.n}동(공실 ${M.excluded.rate}%)까지 넣은 모형에서도 유의.
      세대당 상가면적은 ${M.n}동 모형에서 ${sph.b > 0 ? "+" : ""}${sph.b}%p(p=${sph.p.toFixed(2)}), 287동에서 ${sphF ? (sphF.b > 0 ? "+" : "") + sphF.b + "%p(p=" + sphF.p.toFixed(3) + ")" : "—"}.</p></div>
  </div>
  <p class="small muted" style="margin:10px 0 0">선형 혼합모형(REML), 공실률(면적) 기준. 같은 요인을 점포 한 칸 단위 이항 혼합모형(${M.glmm.n_units.toLocaleString()}칸, 건물·소권역·행정동 무작위절편)으로 다시 추정하면 ${C.length}개 중 ${agree}개 요인의 방향이 같습니다. 잔차의 공간 자기상관은 남지 않았습니다(Moran's I ${M.moran.I}, p=${M.moran.p}). 입점 업종은 현재 상가정보라 조사 시점(2023·2025)과 다르고, 점포 '개수'는 공실의 거울이라 쓰지 않고 구성 비율만 썼습니다.</p>`;
after.after(sec);
})();
</script>
